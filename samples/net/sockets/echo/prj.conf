CONFIG_ETH_ADIN6310=y
#CONFIG_ETH_INIT_PRIORITY=2
#CONFIG_MDIO_INIT_PRIORITY=3
CONFIG_ETH_INIT_PRIORITY=80
CONFIG_MDIO_INIT_PRIORITY=81
CONFIG_PHY_INIT_PRIORITY=82

CONFIG_ETH_ADIN6310_DISABLE_FW_UPDATE=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MDIO=y

#CONFIG_STDOUT_CONSOLE=y
CONFIG_SPI=y
CONFIG_SPI_EXTENDED_MODES=y
# CONFIG_USERSPACE=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SENSOR=y
CONFIG_LTC4296=y

# General config
CONFIG_POSIX_API=y

# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
#CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4_MAPPING_TO_IPV6=n


# Network driver config
CONFIG_TEST_RANDOM_GENERATOR=y


# Network address config
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.0.2.2"
CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
CONFIG_NET_CONFIG_PEER_IPV6_ADDR="2001:db8::2"

CONFIG_GPIO=y
CONFIG_HEAP_MEM_POOL_SIZE=32000
CONFIG_MAIN_STACK_SIZE=30000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_KERNEL_MEM_POOL=y
CONFIG_SPI_LOG_LEVEL_ERR=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_KERNEL_LOG_LEVEL_INF=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=30

CONFIG_NET_LOG=y

CONFIG_NET_SHELL=y
CONFIG_SHELL=y
CONFIG_DEVICE_SHELL=y


# Log do IP (L3) - mostra se o pacote ARP/IP foi processado
CONFIG_NET_IPV4_LOG_LEVEL_DBG=y

CONFIG_NET_IF_MAX_IPV4_COUNT=6
CONFIG_NET_IF_MAX_IPV6_COUNT=6